name: Build XM Lite - Force Update OFF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zipalign

      - name: Download Apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O apktool.jar

      - name: Decode APK
        run: |
          java -jar apktool.jar d base.apk -o decoded --force

      - name: Disable Force Update
        run: |
          FILE="decoded/smali/com/transsion/version/update/RemoteVersionInfo.smali"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: RemoteVersionInfo.smali not found"
            find decoded -iname "*RemoteVersionInfo*.smali" -print
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          def patch_method(text, name):
              pattern = (
                  r'(\.method[^\n]*\s'
                  + re.escape(name)
                  + r'\(\)Z\n)'
                  r'(.*?)'
                  r'(\n\.end method)'
              )

              def replace(m):
                  header = m.group(1)
                  body = m.group(2)
                  end = m.group(3)

                  return (
                      header +
                      "    .locals 1\n"
                      "    const/4 v0, 0x0\n"
                      "    return v0" +
                      end
                  )

              new_text, count = re.subn(
                  pattern,
                  replace,
                  text,
                  flags=re.DOTALL
              )

              if count == 0:
                  raise SystemExit(
                      f"ERROR: Method {name}()Z was not found"
                  )

              print(f"Patched {name}(): {count} method(s)")
              return new_text

          data = patch_method(data, "getForceUpdate")
          data = patch_method(data, "getHasUpdate")

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)
          PY

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decoded -o XM-Lite-ForceUpdate-Off-unsigned.apk

      - name: Align APK
        run: |
          mkdir -p output
          zipalign -f 4 \
            XM-Lite-ForceUpdate-Off-unsigned.apk \
            output/XM-Lite-ForceUpdate-Off.apk

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias xm-lite \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=XM Lite"

      - name: Sign APK
        run: |
          apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            output/XM-Lite-ForceUpdate-Off.apk

          apksigner verify \
            output/XM-Lite-ForceUpdate-Off.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XM-Lite-ForceUpdate-Off
          path: output/XM-Lite-ForceUpdate-Off.apk
