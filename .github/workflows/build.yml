name: Build ProCam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ProCam ZIP
        run: |
          mkdir -p extracted
          unzip -o "ProCam_Reference_Matched_GitHub_Project.zip" -d extracted

      - name: Show extracted files
        run: |
          echo "Project structure:"
          find extracted -maxdepth 3 -type f | sort | head -200

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find extracted -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Build APK
        working-directory: extracted/ProCam_ExactPixel_UI
        run: |
          gradle assembleDebug --stacktrace

      - name: Show APK
        run: |
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCam-APK
          path: extracted/ProCam_ExactPixel_UI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
