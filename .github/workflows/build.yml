name: Build ProCam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ProCam ZIP
        run: |
          mkdir -p extracted
          unzip -o "ProCam_Reference_Matched_GitHub_Project.zip" -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find Android project
        run: |
          echo "Searching for Android project..."
          find extracted \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Check project
        working-directory: extracted/ProCam_ExactPixel_UI
        run: |
          echo "Project:"
          ls -la
          echo "App:"
          ls -la app

      - name: Build APK
        working-directory: extracted/ProCam_ExactPixel_UI
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Find APK
        if: success()
        run: |
          echo "APK files:"
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProCam-APK
          path: extracted/ProCam_ExactPixel_UI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
