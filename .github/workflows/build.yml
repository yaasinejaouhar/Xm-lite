name: Inspect Force Update Logic

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Apktool
        run: |
          wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O apktool.jar

      - name: Decode APK
        run: |
          java -jar apktool.jar d base.apk -o decoded --force

      - name: Extract he0 method
        run: |
          sed -n '500,610p' decoded/smali/AB/he0.smali \
            > force-update-context.txt

          cat force-update-context.txt

      - name: Find method header
        run: |
          grep -n -B 5 -A 100 \
            "invoke-direct {v4, v5, v6, v7, v2}, LAB/Za;-><init>" \
            decoded/smali/AB/he0.smali \
            >> force-update-context.txt || true

      - name: Upload context
        uses: actions/upload-artifact@v4
        with:
          name: Force-Update-Context
          path: force-update-context.txt
