name: Build ProCam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ProCam ZIP
        run: |
          mkdir -p extracted
          unzip -o "ProCam_Reference_Matched_GitHub_Project.zip" -d extracted

      - name: Show project structure
        run: |
          echo "=== Project files ==="
          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"
          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Check Gradle project
        working-directory: extracted/ProCam_ExactPixel_UI
        run: |
          echo "=== Gradle files ==="
          ls -la
          echo "=== App files ==="
          find app -maxdepth 3 -type f | sort

      - name: Build ProCam APK
        working-directory: extracted/ProCam_ExactPixel_UI
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCam-APK
          path: extracted/ProCam_ExactPixel_UI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
