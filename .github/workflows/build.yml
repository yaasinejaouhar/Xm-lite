name: Build ProCam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ProCam ZIP
        run: |
          mkdir -p extracted
          unzip -o "ProCam_Reference_Matched_GitHub_Project.zip" -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure AndroidX
        working-directory: extracted/ProCam_ExactPixel_UI
        run: |
          touch gradle.properties

          grep -qxF "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -qxF "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Check Gradle project
        working-directory: extracted/ProCam_ExactPixel_UI
        run: |
          gradle projects \
            --no-daemon \
            --console=plain

      - name: Build APK
        working-directory: extracted/ProCam_ExactPixel_UI
        run: |
          gradle assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Find APK
        if: success()
        run: |
          echo "=== APK FOUND ==="
          find extracted -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProCam-APK
          path: extracted/ProCam_ExactPixel_UI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
