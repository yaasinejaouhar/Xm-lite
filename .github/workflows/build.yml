name: Find MovieBox Force Update

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Apktool
        run: |
          wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O apktool.jar

      - name: Decode APK
        run: |
          java -jar apktool.jar d base.apk -o decoded --force

      - name: Search Force Update
        run: |
          echo "================================"
          echo "Searching getForceUpdate"
          echo "================================"
          grep -RIn "getForceUpdate" decoded/ || true

          echo ""
          echo "================================"
          echo "Searching getHasUpdate"
          echo "================================"
          grep -RIn "getHasUpdate" decoded/ || true

          echo ""
          echo "================================"
          echo "Searching isForceUpdate"
          echo "================================"
          grep -RIn "isForceUpdate" decoded/ || true

          echo ""
          echo "================================"
          echo "Searching RemoteVersionInfo"
          echo "================================"
          grep -RIn "RemoteVersionInfo" decoded/ || true

          echo ""
          echo "================================"
          echo "Update-related files"
          echo "================================"
          find decoded -type f \
            \( -iname "*update*" -o -iname "*version*" \) \
            -print | head -200

      - name: Save search results
        run: |
          {
            echo "=== getForceUpdate ==="
            grep -RIn "getForceUpdate" decoded/ || true
            echo "=== getHasUpdate ==="
            grep -RIn "getHasUpdate" decoded/ || true
            echo "=== isForceUpdate ==="
            grep -RIn "isForceUpdate" decoded/ || true
            echo "=== RemoteVersionInfo ==="
            grep -RIn "RemoteVersionInfo" decoded/ || true
          } > search-results.txt

      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: Force-Update-Search
          path: search-results.txt
