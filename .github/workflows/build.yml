name: Build XM Lite - Force Update OFF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Apktool
        run: |
          wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O apktool.jar

      - name: Decode APK
        run: |
          java -jar apktool.jar d base.apk -o decoded --force

      - name: Disable Force Update Only
        run: |
          FILE="decoded/smali/AB/he0.smali"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: he0.smali not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          pattern = (
              r'(:goto_6\s*)\n'
              r'(\s*)'
              r'(invoke-direct\s+\{v4,\s*v5,\s*v6,\s*v7,\s*v2\},'
              r'\s*LAB/Za;-><init>\('
              r'Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Z\)V)'
          )

          replacement = (
              r'\1\n'
              r'\2const/4 v2, 0x0\n'
              r'\2\3'
          )

          data, count = re.subn(
              pattern,
              replacement,
              data,
              count=1
          )

          if count != 1:
              print("ERROR: Force Update constructor call not found.")
              print("")
              print("Available LAB/Za constructor calls:")

              for line in data.splitlines():
                  if "LAB/Za;-><init>" in line:
                      print(line)

              raise SystemExit(1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)

          print("SUCCESS: Force Update flag changed to false.")
          PY

          echo ""
          echo "===== Modified section ====="

          grep -n -B 4 -A 6 \
            "LAB/Za;-><init>(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Z)V" \
            "$FILE"

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b decoded \
            -o XM-Lite-ForceUpdate-Off-unsigned.apk

      - name: Install Android Build Tools
        uses: android-actions/setup-android@v3

      - name: Align APK
        run: |
          sdkmanager "build-tools;35.0.0"

          mkdir -p output

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f 4 \
            XM-Lite-ForceUpdate-Off-unsigned.apk \
            output/XM-Lite-ForceUpdate-Off.apk

      - name: Generate Signing Key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release.keystore \
            -alias xm-lite \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=XM Lite"

      - name: Sign APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            output/XM-Lite-ForceUpdate-Off.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            output/XM-Lite-ForceUpdate-Off.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XM-Lite-ForceUpdate-Off
          path: output/XM-Lite-ForceUpdate-Off.apk
