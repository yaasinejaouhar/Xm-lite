name: Inspect Force Update

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Apktool
        run: |
          wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O apktool.jar

      - name: Decode APK
        run: |
          java -jar apktool.jar d base.apk -o decoded --force

      - name: Inspect Za
        run: |
          FILE="decoded/smali/AB/Za.smali"

          echo "===== CLASS HEADER ====="
          sed -n '1,100p' "$FILE"

          echo ""
          echo "===== ALL REFERENCES TO FIELD c:Z ====="
          grep -n -B 8 -A 12 "LAB/Za;->c:Z" "$FILE" || true

          echo ""
          echo "===== CONSTRUCTORS ====="
          grep -n -A 100 "\.method.*<init>" "$FILE" || true

          echo ""
          echo "===== METHODS IN Za ====="
          grep -n "\.method" "$FILE" || true

      - name: Save results
        run: |
          FILE="decoded/smali/AB/Za.smali"

          {
            echo "===== CLASS HEADER ====="
            sed -n '1,100p' "$FILE"

            echo ""
            echo "===== ALL REFERENCES TO FIELD c:Z ====="
            grep -n -B 8 -A 12 "LAB/Za;->c:Z" "$FILE" || true

            echo ""
            echo "===== CONSTRUCTORS ====="
            grep -n -A 100 "\.method.*<init>" "$FILE" || true

            echo ""
            echo "===== METHODS ====="
            grep -n "\.method" "$FILE" || true
          } > Za-results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: Za-ForceUpdate-Results
          path: Za-results.txt
