name: Find Force Update Caller

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Apktool
        run: |
          wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O apktool.jar

      - name: Decode APK
        run: |
          java -jar apktool.jar d base.apk -o decoded --force

      - name: Find Za constructor callers
        run: |
          echo "===== Za constructor references ====="

          grep -RIn -B 15 -A 15 \
            "LAB/Za;-><init>(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Z)V" \
            decoded/ || true

          echo ""
          echo "===== All references to LAB/Za; ====="

          grep -RIn \
            "LAB/Za;" \
            decoded/ || true

      - name: Save results
        run: |
          {
            echo "===== Za constructor references ====="
            grep -RIn -B 15 -A 15 \
              "LAB/Za;-><init>(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Z)V" \
              decoded/ || true

            echo ""
            echo "===== All references to LAB/Za; ====="
            grep -RIn \
              "LAB/Za;" \
              decoded/ || true
          } > Za-caller-results.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: Za-Caller-Results
          path: Za-caller-results.txt
