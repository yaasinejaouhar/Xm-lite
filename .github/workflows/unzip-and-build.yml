      - name: Build APK
        run: |
          GRADLEW=$(find "${{ env.PROJECT_DIR }}" -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find build-project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Found Gradle wrapper: $GRADLEW"
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug
