name: Build XM Lite - Force Update OFF

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Smali tools
        run: |
          curl -L --fail -o baksmali.jar \
            https://repo1.maven.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar
          curl -L --fail -o smali.jar \
            https://repo1.maven.org/maven2/org/smali/smali/2.5.2/smali-2.5.2.jar

      - name: Patch only Force Update
        run: |
          set -e

          mkdir -p work
          unzip -q base.apk -d work/apk

          FOUND=0
          for DEX in work/apk/classes*.dex; do
            [ -f "$DEX" ] || continue
            NAME=$(basename "$DEX")
            mkdir -p "work/$NAME"
            java -jar baksmali.jar d "$DEX" -o "work/$NAME/smali"

            CLASS="work/$NAME/smali/com/transsion/version/update/RemoteVersionInfo.smali"

            if [ -f "$CLASS" ]; then
              FOUND=1
              echo "Found $CLASS"

              python3 - "$CLASS" <<'PY'
import re, sys
p = sys.argv[1]
s = open(p, encoding="utf-8").read()

def patch_method(src, method):
    # Match the complete boolean method and replace only its body.
    pat = re.compile(
        r'(?ms)^(\.method[^\n]*\b' + re.escape(method) + r'\(\)Z[^\n]*\n)'
        r'.*?^\.end method$'
    )
    m = pat.search(src)
    if not m:
        raise SystemExit(f"ERROR: {method}()Z not found in {p}")

    header = m.group(1)
    replacement = header + "    .locals 1\n    const/4 v0, 0x0\n    return v0\n.end method"
    return src[:m.start()] + replacement + src[m.end():]

s2 = patch_method(s, "getForceUpdate")
s3 = patch_method(s2, "getHasUpdate")

open(p, "w", encoding="utf-8").write(s3)
print("Patched ONLY getForceUpdate() and getHasUpdate() to return false.")
PY

              java -jar smali.jar a "work/$NAME/smali" -o "work/$NAME/classes.dex"
              cp "work/$NAME/classes.dex" "$DEX"
              break
            fi
          done

          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: RemoteVersionInfo.smali was not found."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sign APK
        run: |
          sdkmanager "build-tools;35.0.0" >/dev/null
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          keytool -genkeypair \
            -keystore release.keystore \
            -storepass changeit \
            -keypass changeit \
            -alias xm-lite \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=XM-Lite"

          "$BUILD_TOOLS/zipalign" -f -p 4 base.apk aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out XM-Lite-ForceUpdate-Off.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose XM-Lite-ForceUpdate-Off.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XM-Lite-ForceUpdate-Off
          path: XM-Lite-ForceUpdate-Off.apk
